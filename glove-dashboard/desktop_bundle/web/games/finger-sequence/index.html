<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finger Sequence — Cognitive Motor Sequencing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 9999px;
      padding: 6px 18px;
      display: flex;
      gap: 18px;
      align-items: center;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.1);
    }
    .stat { display: flex; align-items: baseline; gap: 5px; }
    .stat-label { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: #64748b; text-transform: uppercase; }
    .stat-val { font-size: 20px; font-weight: 800; color: #2563eb; font-variant-numeric: tabular-nums; }
    .stat-val.accent { color: #059669; }
    .stat-val.latency { color: #d97706; }

    .sequence-board {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .status-banner {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #1e293b;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #cbd5e1;
      padding: 6px 20px;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .pads-grid {
      display: grid;
      grid-template-columns: repeat(2, 135px);
      grid-template-rows: repeat(2, 135px);
      gap: 18px;
    }
    .sensor-pad {
      position: relative;
      border-radius: 20px;
      border: 3px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 800;
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    }
    .sensor-pad:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
    }
    .sensor-pad:active, .sensor-pad.active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 0 28px currentColor !important;
    }

    .pad-thumb { background: linear-gradient(145deg, #f87171, #dc2626); color: #ffffff; }
    .pad-thumb.active { background: #fca5a5 !important; color: #991b1b !important; }

    .pad-index { background: linear-gradient(145deg, #34d399, #059669); color: #ffffff; }
    .pad-index.active { background: #6ee7b7 !important; color: #065f46 !important; }

    .pad-middle { background: linear-gradient(145deg, #38bdf8, #0284c7); color: #ffffff; }
    .pad-middle.active { background: #7dd3fc !important; color: #075985 !important; }

    .pad-ring { background: linear-gradient(145deg, #fbbf24, #d97706); color: #ffffff; }
    .pad-ring.active { background: #fde047 !important; color: #92400e !important; }

    .pad-num { font-size: 30px; font-weight: 900; line-height: 1; }
    .pad-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; opacity: 0.92; }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      color: #475569;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #cbd5e1;
      padding: 6px 16px;
      border-radius: 9999px;
      pointer-events: none;
      font-weight: 600;
      transition: opacity 1s ease;
    }
    .controls-hint.fade-out { opacity: 0; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-card">
      <div class="stat">
        <span class="stat-label">Trial Level</span>
        <span class="stat-val" id="stage-val">Level 1</span>
      </div>
      <div class="stat">
        <span class="stat-label">Accuracy</span>
        <span class="stat-val accent" id="acc-val">100%</span>
      </div>
      <div class="stat">
        <span class="stat-label">Latency</span>
        <span class="stat-val latency" id="latency-val">— ms</span>
      </div>
    </div>
  </div>

  <div class="sequence-board">
    <div class="status-banner" id="banner">WATCH THE SEQUENCE</div>
    <div class="pads-grid">
      <div class="sensor-pad pad-thumb" id="pad-0" data-idx="0">
        <span class="pad-num">1</span>
        <span class="pad-label">Thumb</span>
      </div>
      <div class="sensor-pad pad-index" id="pad-1" data-idx="1">
        <span class="pad-num">2</span>
        <span class="pad-label">Index</span>
      </div>
      <div class="sensor-pad pad-middle" id="pad-2" data-idx="2">
        <span class="pad-num">3</span>
        <span class="pad-label">Middle</span>
      </div>
      <div class="sensor-pad pad-ring" id="pad-3" data-idx="3">
        <span class="pad-num">4</span>
        <span class="pad-label">Ring</span>
      </div>
    </div>
  </div>

  <div class="controls-hint" id="controls-hint">
    <span style="background:#0F172A;color:#fff;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.05em;margin-right:6px">DIGIT FLEXION</span>
    <span>Articulate individual glove fingers to tap matching target pads</span>
  </div>

  <script type="module">
    import { setupGameAudio } from '../lib/rehab-audio.js';

    // ═══════════════════════════════════════════
    // ADAPTIVE ZEN SOUNDSCAPE & ADJUSTABLE VOLUME HUD
    // ═══════════════════════════════════════════
    const gameAudio = setupGameAudio({
      theme: 'zen',
      title: 'Finger Sequence',
      accentColor: '#0D9488',
      hudContainer: '.hud'
    });
    window.gameAudio = gameAudio;

    setTimeout(() => {
      const hint = document.getElementById('controls-hint');
      if (hint) hint.classList.add('fade-out');
    }, 3500);

    let audioCtx = null;

    function initAudio() {
      if (gameAudio.ctx) {
        audioCtx = gameAudio.ctx;
      } else {
        gameAudio.initAudioContext();
        audioCtx = gameAudio.ctx;
      }
    }

    const PAD_FREQS = [440.00, 554.37, 659.25, 880.00];

    function playPadTone(idx) {
      initAudio();
      if (!audioCtx) return;
      try {
        const dest = gameAudio.sfxGain || audioCtx.destination;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(PAD_FREQS[idx], now);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
        osc.connect(gain);
        gain.connect(dest);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }

    function playSuccessChime() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.2, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.32);
        });
      } catch (e) {}
    }

    let sequence = [];
    let playerIndex = 0;
    let isShowingSequence = true;
    let level = 1;
    let totalClicks = 0;
    let correctClicks = 0;
    let inputStartTime = 0;

    function startNewRound() {
      isShowingSequence = true;
      playerIndex = 0;
      document.getElementById('banner').innerText = 'WATCH THE SEQUENCE';
      document.getElementById('banner').style.color = '#1e293b';

      sequence.push(Math.floor(Math.random() * 4));
      document.getElementById('stage-val').innerText = `Level ${level}`;

      let step = 0;
      const interval = setInterval(() => {
        if (step < sequence.length) {
          flashPad(sequence[step]);
          step++;
        } else {
          clearInterval(interval);
          setTimeout(() => {
            isShowingSequence = false;
            inputStartTime = Date.now();
            document.getElementById('banner').innerText = 'YOUR TURN!';
            document.getElementById('banner').style.color = '#0284c7';
          }, 350);
        }
      }, 600);
    }

    function flashPad(idx) {
      initAudio();
      playPadTone(idx);
      const pad = document.getElementById(`pad-${idx}`);
      if (pad) {
        pad.classList.add('active');
        setTimeout(() => pad.classList.remove('active'), 280);
      }
    }

    function handleUserInput(idx) {
      if (isShowingSequence) return;
      initAudio();
      flashPad(idx);

      const latency = Date.now() - inputStartTime;
      document.getElementById('latency-val').innerText = `${latency} ms`;

      totalClicks++;
      if (idx === sequence[playerIndex]) {
        correctClicks++;
        playerIndex++;

        if (playerIndex >= sequence.length) {
          document.getElementById('banner').innerText = 'EXCELLENT!';
          document.getElementById('banner').style.color = '#059669';
          playSuccessChime();
          level++;

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'neuro-game-score',
              game: 'finger-sequence',
              score: level * 100,
              level,
              latency
            }, '*');
          }

          setTimeout(startNewRound, 1100);
        }
      } else {
        document.getElementById('banner').innerText = 'TRY AGAIN!';
        document.getElementById('banner').style.color = '#dc2626';
        setTimeout(() => {
          playerIndex = 0;
          isShowingSequence = false;
          inputStartTime = Date.now();
          document.getElementById('banner').innerText = 'REPEAT PATTERN';
        }, 800);
      }

      const acc = totalClicks > 0 ? Math.round((correctClicks / totalClicks) * 100) : 100;
      document.getElementById('acc-val').innerText = `${acc}%`;
    }

    document.querySelectorAll('.sensor-pad').forEach(pad => {
      pad.addEventListener('pointerdown', () => {
        handleUserInput(parseInt(pad.dataset.idx, 10));
      });
    });

    window.addEventListener('keydown', (e) => {
      const map = { '1': 0, '2': 1, '3': 2, '4': 3 };
      if (map[e.key] !== undefined) handleUserInput(map[e.key]);
    });

    const fingerThresholds = [
      { prev: false }, { prev: false }, { prev: false }, { prev: false }
    ];

    function connectGloveTelemetry() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
      ws.onmessage = (evt) => {
        try {
          const telemetry = JSON.parse(evt.data);
          const hand = telemetry?.hands?.right || telemetry?.hands?.left;
          if (hand && hand.sliders) {
            const s = hand.sliders;
            const vals = [
              s['THUMBBEND1'] ?? s['Thumb_MCP_Flexion'] ?? 0.1,
              s['INDEXBEND1'] ?? s['Index_MCP_Flexion'] ?? 0.1,
              s['MIDDLEBEND1'] ?? s['Middle_MCP_Flexion'] ?? 0.1,
              s['RINGBEND1'] ?? s['Ring_MCP_Flexion'] ?? 0.1
            ];

            const THRESH = 0.45;
            vals.forEach((v, idx) => {
              const flexed = v > THRESH;
              if (flexed && !fingerThresholds[idx].prev) {
                fingerThresholds[idx].prev = true;
                handleUserInput(idx);
              } else if (!flexed && fingerThresholds[idx].prev) {
                fingerThresholds[idx].prev = false;
              }
            });
          }
        } catch (e) {}
      };
      ws.onclose = () => setTimeout(connectGloveTelemetry, 2500);
    }
    connectGloveTelemetry();

    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data) return;
      if (data.type === 'neuro-game-action') {
        if (data.movement === 'wrist_close' || data.action === 'primary_action') handleUserInput(0);
        else if (data.movement === 'pronation' || data.action === 'move_left') handleUserInput(1);
        else if (data.movement === 'supination' || data.action === 'move_right') handleUserInput(2);
        else if (data.movement === 'wrist_open' || data.action === 'secondary_action') handleUserInput(3);
      }
    });

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'night-relay-ready' }, '*');
    }

    setTimeout(startNewRound, 800);
  </script>
</body>
</html>
