<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Glider - Pronation / Supination Rehabilitation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: #0D47A1;
    }
    #game-canvas {
      width: 100%; height: 100%;
      display: block;
    }

    /* ─── Glassmorphism HUD ─── */
    .hud {
      position: absolute; top: 18px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center;
      gap: 14px; pointer-events: none; z-index: 10;
    }
    .hud-pill {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 12px 36px rgba(13, 71, 161, 0.18), 0 2px 8px rgba(0,0,0,0.04);
      border-radius: 999px;
      padding: 8px 24px;
      display: flex; gap: 22px; align-items: center;
    }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat-label {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: #64748B;
    }
    .stat-val {
      font-size: 22px; font-weight: 800; color: #0F172A; line-height: 1.1;
      font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
    }
    .stat-val.blue { color: #0284C7; }
    .stat-val.gold { color: #D97706; }
    .stat-val.pink { color: #DB2777; }

    .level-pill {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 12px 36px rgba(13, 71, 161, 0.18);
      border-radius: 999px;
      padding: 8px 20px;
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; font-weight: 700; color: #334155;
    }
    .lvl-num {
      background: linear-gradient(135deg, #0284C7, #0369A1);
      color: white; border-radius: 999px;
      padding: 3px 10px; font-size: 12px; font-weight: 800;
    }
    .level-bar {
      width: 80px; height: 8px; background: #E2E8F0;
      border-radius: 999px; overflow: hidden;
    }
    .level-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #38BDF8, #0284C7);
      border-radius: 999px; transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ─── Rotation / Bank Gauge ─── */
    .gauge-pill {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 12px 36px rgba(13, 71, 161, 0.18);
      border-radius: 999px;
      padding: 8px 18px;
      display: flex; align-items: center; gap: 10px;
    }
    .gauge-label {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: #64748B;
    }
    .gauge-track {
      width: 100px; height: 8px; background: #E2E8F0;
      border-radius: 999px; position: relative;
    }
    .gauge-center {
      position: absolute; left: 50%; top: -2px; bottom: -2px;
      width: 2px; background: #94A3B8; transform: translateX(-50%);
    }
    .gauge-needle {
      position: absolute; top: -5px; width: 18px; height: 18px;
      background: linear-gradient(135deg, #0284C7, #0369A1);
      border: 2px solid white; border-radius: 50%;
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.4);
      transform: translateX(-50%);
      transition: left 0.08s ease-out;
    }
    .gauge-deg {
      font-size: 13px; font-weight: 800; color: #0284C7; min-width: 38px; text-align: right;
      font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
    }

    /* ─── Toast Feedback ─── */
    .toast {
      position: absolute; top: 88px; left: 50%;
      transform: translateX(-50%) translateY(-20px) scale(0.9);
      background: linear-gradient(135deg, #E0F2FE, #FFFFFF);
      border: 2px solid #38BDF8; border-radius: 60px;
      padding: 10px 30px; color: #0369A1;
      font-size: 15px; font-weight: 800; letter-spacing: 0.5px;
      box-shadow: 0 16px 40px rgba(2, 132, 199, 0.25);
      opacity: 0; pointer-events: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 30;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

    /* ─── Clinical HUD Controls Bar ─── */
    .controls-hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 8px 24px; border-radius: 9999px;
      font-size: 12.5px; font-weight: 600; color: #334155;
      box-shadow: 0 12px 32px rgba(13, 71, 161, 0.14);
      display: flex; gap: 14px; align-items: center;
      pointer-events: none; z-index: 20;
    }
    .hint-step { display: flex; align-items: center; gap: 7px; }
    .motion-badge {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.6px; padding: 2px 8px; border-radius: 6px;
      background: #E0F2FE; color: #0284C7;
    }
    .motion-badge.alt { background: #F3E8FF; color: #7E22CE; }
    .motion-badge.target { background: #FEF3C7; color: #D97706; }
    .hint-divider { width: 1px; height: 14px; background: #CBD5E1; }

    /* ─── Level Modal ─── */
    .modal-overlay {
      position: absolute; inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease; z-index: 100;
    }
    .modal-overlay.show { display: none !important; }
    .modal-card {
      background: linear-gradient(145deg, #FFFFFF, #F0F9FF);
      border-radius: 32px; padding: 44px; width: 90%; max-width: 460px;
      text-align: center;
      box-shadow: 0 32px 64px rgba(2, 132, 199, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.8);
      transform: scale(0.85) translateY(20px);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.show .modal-card { transform: scale(1) translateY(0); }
    .modal-badge {
      width: 72px; height: 72px; margin: 0 auto 16px;
      border-radius: 50%; background: linear-gradient(135deg, #E0F2FE, #BAE6FD);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.2);
    }
    .modal-title { font-size: 26px; font-weight: 800; color: #0F172A; margin-bottom: 8px; }
    .modal-sub { font-size: 14.5px; color: #475569; line-height: 1.6; margin-bottom: 24px; }
    .modal-btn {
      background: linear-gradient(135deg, #0284C7, #0369A1);
      color: white; border: none; padding: 16px 38px;
      border-radius: 999px; font-size: 15.5px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .modal-btn:hover { transform: scale(1.04); box-shadow: 0 12px 32px rgba(2, 132, 199, 0.45); }
    .hud {top:16px;right:24px;left:auto;width:280px;justify-content:flex-start;flex-direction:column;align-items:stretch;gap:8px;}
    .hud-pill {padding:10px 14px;}
    .gauge-deg {width:auto;min-width:95px;font-size:12px;}
    .controls-hint {left:18px;bottom:18px;transform:none;max-width:calc(100vw - 350px);white-space:normal;flex-wrap:wrap;}
    .next-lane {position:absolute;top:18px;left:18px;padding:10px 16px;background:#fffffff0;border-radius:14px;color:#0f6c73;font-weight:700;z-index:20;}
    .toast {left:18px;top:70px;transform:translateY(-10px);max-width:300px;font-size:14px;padding:12px 16px;}
    .toast.show {transform:translateY(0);}
    .missile-hit::after {content:'';position:fixed;inset:0;box-shadow:inset 0 0 65px #f8717180;pointer-events:none;z-index:19;}
    @media(prefers-reduced-motion:reduce){.missile-hit canvas{transform:none!important}}
    @media(max-width:700px){.hud{max-width:calc(100vw - 36px)}.hud-pill{padding:6px 10px}.next-lane{top:110px;font-size:12px}.toast{top:154px}.controls-hint{max-width:45vw;font-size:11px}}
  </style>
</head>
<body>
  <!-- HUD -->
  <div class="next-lane" id="next-lane">NEXT RING · RIGHT</div>
  <div class="hud">
    <div class="hud-pill">
      <div class="stat"><span class="stat-label">Ring Pairs</span><span class="stat-val" id="val-reps" style="color:#16A34A;font-weight:800;">0</span></div>
      <div class="stat"><span class="stat-label">Rings Cleared</span><span class="stat-val blue" id="val-rings">0</span></div>
      <div class="stat"><span class="stat-label">Score</span><span class="stat-val gold" id="val-score">0</span></div>
      <div class="stat"><span class="stat-label">Hits</span><span class="stat-val pink" id="val-combo">×1</span></div>
    </div>
    <div class="level-pill" id="hand-pill" style="cursor:pointer;" title="Click to toggle Left Hand / Right Hand">
      <span>HAND:</span><span class="lvl-num" id="val-hand">LH (LEFT)</span>
      <span style="font-size:11px;font-weight:700;color:#0369A1;" id="hand-rule-badge">Pro➔Sup: Left</span>
    </div>
    <div class="gauge-pill">
      <span class="gauge-label">Pose</span>
      <div class="gauge-track">
        <div class="gauge-center"></div>
        <div class="gauge-needle" id="gauge-needle" style="left:50%"></div>
      </div>
      <span class="gauge-deg" id="gauge-deg">0°</span>
    </div>
    <div class="level-pill" id="sound-pill" style="cursor:pointer;pointer-events:auto;" title="Click to toggle BGM & Audio">
      <span>🎵 BGM & AUDIO:</span>
      <span class="lvl-num" id="val-sound" style="background:#0284C7;">ON</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Clinical Controls Guide -->
  <div class="controls-hint" id="controls-hint" style="padding:8px 24px;border-radius:999px;">
    <div class="hint-step">
      <span class="motion-badge" id="hint-pro-badge" style="background:#E0F2FE;color:#0284C7;font-weight:800;">PRO ➔ SUP</span>
      <span class="hint-label" id="hint-pro-label">LH Hand: Turn Left</span>
    </div>
    <span class="hint-divider">➔</span>
    <div class="hint-step">
      <span class="motion-badge alt" id="hint-sup-badge" style="background:#F3E8FF;color:#7E22CE;font-weight:800;">SUP ➔ PRO</span>
      <span class="hint-label" id="hint-sup-label">LH Hand: Turn Right</span>
    </div>
    <span class="hint-divider">➔</span>
    <div class="hint-step">
      <span class="motion-badge target" style="background:#FEF3C7;color:#D97706;font-weight:800;">OBJECTIVE</span>
      <span class="hint-label">Collect rings · Avoid missiles</span>
    </div>
  </div>

  <!-- Stage Victory Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-badge">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="6"/>
          <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
        </svg>
      </div>
      <h2 class="modal-title" id="m-title">Flight Stage Cleared!</h2>
      <p class="modal-sub" id="m-desc">Excellent rotational wing stability.</p>
      <button class="modal-btn" id="m-btn">Next Canyon Course &rarr;</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="module">
    import { bindGloveControls } from '../glove-controls.js';
    import { FlightRound } from '../gameplay-rules.js';
    import * as THREE from '../lib/three.module.min.js';
    import { setupGameAudio } from '../lib/rehab-audio.js';

    // ═══════════════════════════════════════════
    // PROCEDURAL AUDIO ENGINE & HUD
    // ═══════════════════════════════════════════
    const gameAudio = setupGameAudio({
      theme: 'casual',
      title: 'Sky Glider',
      accentColor: '#0284C7',
      hudContainer: '.hud'
    });
    window.gameAudio = gameAudio;

    class SkyAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.initialized = false;

        // Downloaded Audio Assets (wrapped safely so unsupported audio environments do not halt execution)
        try {
          this.bgm = typeof Audio !== 'undefined' ? new Audio('./audio/bgm.ogg') : null;
          if (this.bgm) { this.bgm.loop = true; this.bgm.volume = 0.28; }

          this.ringAudio = typeof Audio !== 'undefined' ? new Audio('./audio/ring.ogg') : null;
          if (this.ringAudio) { this.ringAudio.volume = 0.50; }

          this.hitAudio = typeof Audio !== 'undefined' ? new Audio('./audio/hit.ogg') : null;
          if (this.hitAudio) { this.hitAudio.volume = 0.45; }

          this.fanfareAudio = typeof Audio !== 'undefined' ? new Audio('./audio/fanfare.ogg') : null;
          if (this.fanfareAudio) { this.fanfareAudio.volume = 0.45; }
        } catch {
          this.bgm = null;
          this.ringAudio = null;
          this.hitAudio = null;
          this.fanfareAudio = null;
        }
      }
      init() {
        if (!this.ctx) {
          gameAudio.initAudioContext();
          this.ctx = gameAudio.ctx;
        } else if (this.ctx.state === 'suspended') {
          void this.ctx.resume().catch(() => {});
        }
        if (!this.initialized && !this.muted) {
          this.initialized = true;
          if (this.bgm) this.bgm.play().catch(() => {});
        }
      }
      toggleMute() {
        this.init();
        this.muted = !this.muted;
        if (this.muted) {
          if (this.bgm) this.bgm.pause();
        } else {
          if (this.bgm) this.bgm.play().catch(() => {});
        }
        return !this.muted;
      }
      ringHit() {
        this.init();
        if (this.muted) return;
        try {
          if (this.ringAudio) {
            const snd = this.ringAudio.cloneNode();
            snd.volume = 0.42;
            snd.play().catch(() => {});
            return;
          }
        } catch {}
        this.playTone(880, 'triangle', 0.25, 0.2);
      }
      hit() {
        this.init();
        if (this.muted) return;
        try {
          if (this.hitAudio) {
            const snd = this.hitAudio.cloneNode();
            snd.volume = 0.48;
            snd.play().catch(() => {});
            return;
          }
        } catch {}
        this.playTone(120, 'sawtooth', 0.2, 0.25);
      }
      miss() { this.hit(); }
      fanfare() {
        this.init();
        if (this.muted) return;
        try {
          if (this.fanfareAudio) {
            const snd = this.fanfareAudio.cloneNode();
            snd.volume = 0.45;
            snd.play().catch(() => {});
            return;
          }
        } catch {}
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.4, 0.25), i * 70));
      }
      whoosh() {
        this.init();
        if (this.muted) return;
        this.playTone(280, 'sine', 0.16, 0.08);
      }
      play(freq, type, dur, vol = 0.25) {
        this.playTone(freq, type, dur, vol);
      }
      playTone(freq, type, dur, vol = 0.2) {
        if (!this.ctx || this.muted) return;
        try {
          const dest = gameAudio.sfxGain || this.ctx.destination;
          const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = type; o.frequency.setValueAtTime(freq, t);
          o.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.4, 20), t + dur);
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(dest);
          o.start(t); o.stop(t + dur + 0.01);
        } catch {}
      }
      updateEngineRPM(tiltDeg) {
        if (!this.engine || this.muted) return;
        const speedBoost = Math.min(0.35, Math.abs(tiltDeg) * 0.012);
        this.engine.playbackRate = 0.95 + speedBoost;
      }
    }
    const sfx = new SkyAudioEngine();
    window.addEventListener('click', () => sfx.init());
    window.addEventListener('pointerdown', () => sfx.init());
    window.addEventListener('keydown', () => sfx.init());

    // ═══════════════════════════════════════════
    // LEVEL PROGRESSION PROFILE
    // ═══════════════════════════════════════════
    const LEVELS = [
      { name: "Emerald Canyon", targetRings: 8, ringSpeed: 22, ringSpacing: 28 },
      { name: "Golden Ridge", targetRings: 12, ringSpeed: 26, ringSpacing: 25 },
      { name: "Azure Heights", targetRings: 16, ringSpeed: 30, ringSpacing: 22 },
      { name: "Sunset Horizon", targetRings: 20, ringSpeed: 34, ringSpacing: 20 },
      { name: "Grand Apex Vista", targetRings: 25, ringSpeed: 38, ringSpacing: 18 }
    ];

    let currentLevel = 0;
    let ringsCleared = 0;
    let score = 0;
    let combo = 1;
    let stageRings = 0;

    let currentTiltDeg = 0; // -45 to +45 deg
    let targetX = 0;

    // ═══════════════════════════════════════════
    // THREE.JS RENDERER & SCENE SETUP
    // ═══════════════════════════════════════════
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();

    // Vibrant alpine sunset sky gradient
    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 2; skyCanvas.height = 512;
    const skyCtx = skyCanvas.getContext('2d');
    const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 512);
    skyGrad.addColorStop(0, '#0D47A1');   // Deep cobalt twilight zenith
    skyGrad.addColorStop(0.3, '#1976D2'); // Royal blue
    skyGrad.addColorStop(0.55, '#42A5F5'); // Azure sky
    skyGrad.addColorStop(0.75, '#90CAF9'); // Soft sky
    skyGrad.addColorStop(0.9, '#FFCC80');  // Sunset peach
    skyGrad.addColorStop(1, '#FFE082');    // Golden horizon glow
    skyCtx.fillStyle = skyGrad;
    skyCtx.fillRect(0, 0, 2, 512);
    const skyTex = new THREE.CanvasTexture(skyCanvas);
    skyTex.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = skyTex;
    scene.environment = skyTex;
    scene.fog = new THREE.FogExp2(0xFFE0B2, 0.007);

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.8, 450);
    camera.position.set(0, 5.8, 11.0);

    // ═══════════════════════════════════════════
    // LIGHTING SYSTEM
    // ═══════════════════════════════════════════
    const ambLight = new THREE.AmbientLight(0xFFF3E0, 0.65);
    scene.add(ambLight);

    const sun = new THREE.DirectionalLight(0xFFFFE0, 2.2);
    sun.position.set(25, 45, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 100;
    sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -10;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);

    const fillLight = new THREE.DirectionalLight(0x81D4FA, 0.7);
    fillLight.position.set(-20, 15, -10);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xFFD54F, 0.5);
    rimLight.position.set(0, 5, 20);
    scene.add(rimLight);

    // ═══════════════════════════════════════════
    // ENVIRONMENT: SCENIC STREAMING CANYON, RIVER & MOUNTAINS
    // ═══════════════════════════════════════════

    // Canyon Floor / Valley
    const valleyGeo = new THREE.PlaneGeometry(320, 700, 32, 32);
    const valleyMat = new THREE.MeshStandardMaterial({
      color: 0x4CAF50, roughness: 0.85, metalness: 0.05
    });
    const valley = new THREE.Mesh(valleyGeo, valleyMat);
    valley.rotation.x = -Math.PI / 2;
    valley.position.set(0, -6.5, -150);
    valley.receiveShadow = true;
    scene.add(valley);

    // Dynamic Sparkling Alpine River with flowing water ripple texture
    const waterCanvas = document.createElement('canvas');
    waterCanvas.width = 128; waterCanvas.height = 512;
    const wCtx = waterCanvas.getContext('2d');
    const wGrad = wCtx.createLinearGradient(0, 0, 128, 512);
    wGrad.addColorStop(0, '#0284C7');
    wGrad.addColorStop(0.5, '#38BDF8');
    wGrad.addColorStop(1, '#0369A1');
    wCtx.fillStyle = wGrad; wCtx.fillRect(0, 0, 128, 512);
    wCtx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    for (let i = 0; i < 35; i++) {
      wCtx.fillRect(Math.random() * 100, Math.random() * 490, 16 + Math.random() * 30, 2.5);
    }
    const waterTex = new THREE.CanvasTexture(waterCanvas);
    waterTex.wrapS = THREE.RepeatWrapping;
    waterTex.wrapT = THREE.RepeatWrapping;
    waterTex.repeat.set(1, 14);

    const riverGeo = new THREE.PlaneGeometry(16, 700, 8, 32);
    const riverMat = new THREE.MeshStandardMaterial({
      map: waterTex, color: 0xBAE6FD, roughness: 0.15, metalness: 0.5
    });
    const river = new THREE.Mesh(riverGeo, riverMat);
    river.rotation.x = -Math.PI / 2;
    river.position.set(0, -6.42, -150);
    scene.add(river);

    // Riverbank sand borders
    const riverBankGeo = new THREE.PlaneGeometry(24, 700);
    const riverBankMat = new THREE.MeshStandardMaterial({ color: 0xD7CCC8, roughness: 0.9 });

        new THREE.MeshBasicMaterial({color:0xffbd59}));
      flame.rotation.x = -Math.PI/2; flame.position.z = -1.2; missile.add(flame);
      // After collection, threaten that same lane: rotate back to dodge and collect.
      missile.position.set(lane * LANE_RIGHT_X, FLIGHT_ALTITUDE,zPos);
      missile.userData.hit = false;
      scene.add(missile); missiles.push(missile);
    }
    function nextTarget() {
      spawnRing(-82); // about six seconds; missiles sit between successive rings
      document.getElementById('next-lane').textContent = flight.ringLane === -1 ? 'NEXT RING · LEFT' : 'NEXT RING · RIGHT';
    }

    // ═══════════════════════════════════════════
    // SPARKLE PARTICLE BURST SYSTEM
    // ═══════════════════════════════════════════
    const particles = [];
    const sparkGeo = new THREE.SphereGeometry(0.12, 6, 6);
    const sparkMat = new THREE.MeshStandardMaterial({
      color: 0xFDE047, emissive: 0xF59E0B, emissiveIntensity: 1.2, roughness: 0.1
    });

    function spawnSparkBurst(x, y, z) {
      for (let i = 0; i < 24; i++) {
        const p = new THREE.Mesh(sparkGeo, sparkMat);
        p.position.set(x, y, z);
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const spd = 4 + Math.random() * 8;
        p.userData = {
          vx: Math.sin(phi) * Math.cos(theta) * spd,
          vy: Math.sin(phi) * Math.sin(theta) * spd,
          vz: Math.cos(phi) * spd,
          life: 0.6 + Math.random() * 0.4,
          maxLife: 1.0
        };
        scene.add(p);
        particles.push(p);
      }
    }

    // ═══════════════════════════════════════════
    // TELEMETRY & INPUT HANDLING
    // ═══════════════════════════════════════════
    let activeHand = 'LEFT';
    function setHand(hand) {
      activeHand = hand === 'RIGHT' ? 'RIGHT' : 'LEFT';
      flight.configure(activeHand);
      targetX = flight.lane * LANE_RIGHT_X;
      planeGroup.position.x = targetX;
      currentTiltDeg = 0;
      activeRings.forEach(r => scene.remove(r)); activeRings.length = 0;
      missiles.forEach(m => scene.remove(m)); missiles.length = 0;
      score = 0; ringsCleared = 0;
      document.getElementById('val-hand').textContent = activeHand === 'LEFT' ? 'LH (LEFT)' : 'RH (RIGHT)';
      document.getElementById('hand-rule-badge').textContent = activeHand === 'LEFT' ? 'Pro➔Sup: Left' : 'Pro➔Sup: Right';
      document.getElementById('hint-pro-label').textContent = activeHand === 'LEFT' ? 'Move Left' : 'Move Right';
      document.getElementById('hint-sup-label').textContent = activeHand === 'LEFT' ? 'Move Right' : 'Move Left';
      updateFlightHUD();
      nextTarget();
    }
    function updateFlightHUD() {
      document.getElementById('val-score').textContent = flight.score;
      document.getElementById('val-rings').textContent = flight.rings;
      document.getElementById('val-reps').textContent = Math.floor(flight.rings / 2);
      document.getElementById('val-combo').textContent = flight.hits;
      document.getElementById('gauge-deg').textContent = flight.pose.toUpperCase();
      document.getElementById('gauge-needle').style.left = flight.lane === -1 ? '0%' : '100%';
      if (window.parent !== window) window.parent.postMessage({
        type:'neuro-game-score',exercise:'pronation_supination',score:flight.score,
      }, window.location.origin);
    }
    setHand(activeHand);
    // Toggle hand when clicking HUD pill
    document.getElementById('hand-pill')?.addEventListener('click', () => {
      if (window.parent !== window) return; // Parent owns the selected glove.
      setHand(activeHand === 'LEFT' ? 'RIGHT' : 'LEFT');
      showToast(`Switched to ${activeHand} Hand mode`);
    });

    // Toggle BGM & Audio when clicking sound pill
    document.getElementById('sound-pill')?.addEventListener('click', () => {
      const active = sfx.toggleMute();
      const badge = document.getElementById('val-sound');
      if (badge) {
        badge.textContent = active ? 'ON' : 'MUTED';
        badge.style.background = active ? '#0284C7' : '#64748B';
      }
      showToast(active ? '🎵 BGM & Audio ON' : '🔇 Audio Muted');
    });

    function moveToPose(movement) {
      if (!flight.move(movement)) return false;
      targetX = flight.lane * LANE_RIGHT_X;
      currentTiltDeg = (targetX - planeGroup.position.x) * -5;
      updateFlightHUD();
      if (typeof sfx !== 'undefined') sfx.whoosh();
      return true;
    }
    bindGloveControls('sky_glider', {
      configure: data => setHand(data.side),
      left: data => { if (data.side !== activeHand) setHand(data.side); return moveToPose(data.movement); },
      right: data => { if (data.side !== activeHand) setHand(data.side); return moveToPose(data.movement); },
    });

    // Keyboard Fallback for Manual Testing
    window.addEventListener('keydown', e => {
      if (window.parent !== window || e.repeat) return;
      if (!['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)) return;
      e.preventDefault(); sfx.init();
      const lane = ['ArrowLeft','KeyA'].includes(e.code) ? -1 : 1;
      const movement = lane === (activeHand === 'LEFT' ? -1 : 1) ? 'supination' : 'pronation';
      moveToPose(movement);
    });

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    // ═══════════════════════════════════════════
    // ANIMATION & GAME LOOP
    // ═══════════════════════════════════════════
    let lastTime = performance.now();
    const flightSpeed = 16;

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      try {
        // High-RPM Propeller spin
        propGroup.rotation.z += 0.85;

        // Update engine audio pitch with banking roll
        sfx.updateEngineRPM(currentTiltDeg);
        if (gameAudio?.updateFlight) {
          gameAudio.updateFlight(planeGroup.rotation.z, flightSpeed);
        }
      } catch (err) {
        console.warn('Audio/prop update error:', err);
      }

      // Stream Mountain Ridges forward in Z (endless canyon rush)
      for (let i = 0; i < sceneryMountains.length; i++) {
        const m = sceneryMountains[i];
        m.position.z += flightSpeed * delta;
        if (m.position.z > 60) m.position.z -= 560;
      }

      // Stream Alpine Pine Trees forward in Z (intense ground rush parallax)
      for (let i = 0; i < sceneryTrees.length; i++) {
        const t = sceneryTrees[i];
        t.position.z += flightSpeed * delta;
        if (t.position.z > 25) t.position.z -= 360;
      }

      // Dynamic River Water Flowing Texture (calm, natural alpine flow)
      waterTex.offset.y += (flightSpeed * 0.008) * delta;

      // High-Speed 3D Wind Streaks rushing past camera
      const posArr = speedStreakGeo.attributes.position.array;
      for (let i = 0; i < streakCount; i++) {
        posArr[i * 6 + 2] += flightSpeed * 2.2 * delta;
        posArr[i * 6 + 5] = posArr[i * 6 + 2] + 5.0;
        if (posArr[i * 6 + 2] > 20) {
          posArr[i * 6 + 2] = -260 - Math.random() * 50;
          posArr[i * 6 + 5] = posArr[i * 6 + 2] + 5.0;
          posArr[i * 6] = (Math.random() - 0.5) * 26;
          posArr[i * 6 + 3] = posArr[i * 6];
          posArr[i * 6 + 1] = 0.5 + Math.random() * 8;
          posArr[i * 6 + 4] = posArr[i * 6 + 1];
        }
      }
      speedStreakGeo.attributes.position.needsUpdate = true;

      // Smooth aircraft lateral interpolation
      planeGroup.position.x += (targetX - planeGroup.position.x) * (1 - Math.exp(-6 * delta));
      currentTiltDeg *= Math.exp(-5 * delta);

      // Subtle aerodynamic lift bobbing (air cushion floating sensation)
      planeGroup.position.y = FLIGHT_ALTITUDE + Math.sin(now * 0.0035) * 0.04;

      // Forearm banking roll
      const targetRoll = (-currentTiltDeg * Math.PI) / 180;
      planeGroup.rotation.z += (targetRoll - planeGroup.rotation.z) * 0.15;
      // Slight aerodynamic yaw and pitch
      planeGroup.rotation.y = (-currentTiltDeg * Math.PI) / 320;
      planeGroup.rotation.x = -0.04 + Math.sin(now * 0.003) * 0.02;

      // Articulated Ailerons & Rudder respond dynamically to banking
      leftAileron.rotation.x = -planeGroup.rotation.z * 0.45;
      rightAileron.rotation.x = planeGroup.rotation.z * 0.45;
      rudder.rotation.y = -planeGroup.rotation.z * 0.35;

      // Blinking Tail Strobe Beacon
      tailStrobe.material.emissiveIntensity = (Math.sin(now * 0.008) > 0.85) ? 4.0 : 0.2;

      // Camera dynamic chase banking with proper flight altitude framing
      const camTargetX = 0;
      camera.position.x += (camTargetX - camera.position.x) * 0.08;
      camera.position.y = 5.8;
      camera.position.z = 11.0;
      camera.lookAt(0, 2.0, -8);
      camera.rotation.z = -planeGroup.rotation.z * 0.12;

      // Hot air balloons gentle float bobbing
      balloons.forEach((b, idx) => {
        b.position.y += Math.sin(now * 0.001 + idx) * 0.02;
      });

      // Clouds drift toward camera
      clouds.forEach(c => {
        c.position.z += c.userData.speed * delta;
        if (c.position.z > 25) {
          c.position.z = -300;
          c.position.x = (Math.random() - 0.5) * 110;
        }
      });

      // Update wingtip contrail ribbon trails
      const leftTipWorld = new THREE.Vector3(-3.25, -0.05, 0.02).applyMatrix4(planeGroup.matrixWorld);
      const rightTipWorld = new THREE.Vector3(3.25, -0.05, 0.02).applyMatrix4(planeGroup.matrixWorld);

      leftTrailHistory.unshift(leftTipWorld);
      rightTrailHistory.unshift(rightTipWorld);
      if (leftTrailHistory.length > 20) leftTrailHistory.pop();
      if (rightTrailHistory.length > 20) rightTrailHistory.pop();

      const lArr = trailPositions[0];
      const rArr = trailPositions[1];
      for (let i = 0; i < leftTrailHistory.length; i++) {
        lArr[i * 3] = leftTrailHistory[i].x;
        lArr[i * 3 + 1] = leftTrailHistory[i].y;
        lArr[i * 3 + 2] = leftTrailHistory[i].z;
        rArr[i * 3] = rightTrailHistory[i].x;
        rArr[i * 3 + 1] = rightTrailHistory[i].y;
        rArr[i * 3 + 2] = rightTrailHistory[i].z;
      }
      trailGeos[0].setAttribute('position', new THREE.BufferAttribute(lArr.subarray(0, leftTrailHistory.length * 3), 3));
      trailGeos[1].setAttribute('position', new THREE.BufferAttribute(rArr.subarray(0, rightTrailHistory.length * 3), 3));

      // Endless two-lane course. Target collection, not elapsed time, advances the route.
      for (let i = activeRings.length - 1; i >= 0; i--) {
        const ring = activeRings[i];
        ring.position.z += flightSpeed * delta;
        ring.userData.gem.rotation.y += delta;
        ring.userData.inner.rotation.z -= delta;
        const dz = Math.abs(ring.position.z - planeGroup.position.z);
        const dx = Math.abs(ring.position.x - planeGroup.position.x);
        if (!ring.userData.cleared && dz < 1.5 && dx < 1.3 &&
            flight.collect(ring.userData.isLeftLane ? -1 : 1)) {
          ring.userData.cleared = true;
          spawnSparkBurst(ring.position.x, ring.position.y, ring.position.z);
          sfx.ringHit(); showToast('RING +150 · Rotate back for the next target');
          updateFlightHUD();
          spawnMissile(-40, ring.userData.isLeftLane ? -1 : 1);
          nextTarget();
        }
        if (ring.position.z > 14) {
          if (!ring.userData.cleared) { sfx.miss(); showToast('Missed ring · Retry the same target'); }
          scene.remove(ring); activeRings.splice(i,1);
          // A collected ring already scheduled its successor and intervening missile.
          // A miss retries the same pose target without inventing another transition.
          if (!ring.userData.cleared) nextTarget();
        }
      }
      for (let i = missiles.length - 1; i >= 0; i--) {
        const missile = missiles[i];
        missile.position.z += flightSpeed * delta;
        if (!missile.userData.hit &&
            Math.abs(missile.position.z-planeGroup.position.z) < 1.5 &&
            Math.abs(missile.position.x-planeGroup.position.x) < 1.2) {
          missile.userData.hit = true;
          if (flight.missile(now / 1000)) {
            shakeUntil = now + 420; sfx.miss();
            showToast('MISSILE HIT · −50 · Keep flying'); updateFlightHUD();
          }
        }
        if (missile.position.z > 16) { scene.remove(missile); missiles.splice(i,1); }
      }
      const shaking = now < shakeUntil;
      renderer.domElement.style.transform = shaking ? 'translate(' + (Math.sin(now*.08)*4) + 'px,' + (Math.cos(now*.06)*3) + 'px)' : '';
      document.body.classList.toggle('missile-hit',shaking);

      // Update particle sparkles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.x += p.userData.vx * delta;
        p.position.y += p.userData.vy * delta;
        p.position.z += p.userData.vz * delta;
        p.userData.life -= delta;
        const scale = p.userData.life / p.userData.maxLife;
        p.scale.set(scale, scale, scale);
        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // ═══════════════════════════════════════════
    // LEVEL WIN & TRANSITION MODAL
    // ═══════════════════════════════════════════
    function resizeGame() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      const reserve = window.parent !== window && window.innerWidth > 700 ? 308 : 0;
      // Widen the lens on shorter/narrower play areas so neither wing enters the rig.
      camera.fov = Math.max(46, 2 * Math.atan(window.innerHeight * 6.5 / ((window.innerWidth - reserve) * 9)) * 180 / Math.PI);
      camera.setViewOffset(window.innerWidth,window.innerHeight,reserve / 2,0,window.innerWidth,window.innerHeight);
    }
    window.addEventListener('resize',resizeGame);
    resizeGame();
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'night-relay-ready' }, window.location.origin);
    }
  </script>
</body>
</html>
